app = "ebilling-dashboard"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/billing.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "billing_data"
  destination = "/data"
  initial_size = "1gb"
